services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /home/cuong/Config/Jellyfin:/config
      # --- CẤU HÌNH CHUẨN ---
      - /home/cuong/Data/Torrents:/data/media_local
      - /mnt/external:/data/media_ext1
      - /mnt/external2:/data/media_ext2
    ports:
      - 8096:8096
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=8080
    volumes:
      - /home/cuong/Config/qbittorrent:/config
      # Map full cả 3 ổ để tải đâu cũng được
      - /home/cuong/Data/Torrents:/data/media_local
      - /mnt/external:/data/media_ext1
      - /mnt/external2:/data/media_ext2
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Radarr:/config
      - /home/cuong/Data/Torrents:/data/media_local
      - /mnt/external:/data/media_ext1
      - /mnt/external2:/data/media_ext2
    ports:
      - 7878:7878
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Sonarr:/config
      - /home/cuong/Data/Torrents:/data/media_local
      - /mnt/external:/data/media_ext1
      - /mnt/external2:/data/media_ext2
    ports:
      - 8989:8989
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Bazarr:/config
      # --- ĐÃ SỬA LẠI CHO ĐÚNG ---
      - /home/cuong/Data/Torrents:/data/media_local
      - /mnt/external:/data/media_ext1
      - /mnt/external2:/data/media_ext2
    ports:
      - 6767:6767
    restart: always
    
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/prowlarr:/config
    ports:
      - 9696:9696
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - DISPLAY_TIMEZONE=Asia/Ho_Chi_Minh
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=${SPEEDTEST_APP_URL}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * *
      - SPEEDTEST_SERVERS=
      - PRUNE_RESULTS_OLDER_THAN=0
    volumes:
      - /home/cuong/Config/speedtest-tracker:/config
    ports:
      - 6875:80
    restart: unless-stopped

  dashdot:
    image: mauricenino/dashdot:latest
    container_name: dashdot
    restart: unless-stopped
    privileged: true
    ports:
      - 3001:3001
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: 'true'

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_KEY}
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/cuong/Config/Homarr:/appdata
    ports:
      - 7575:7575