services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /home/cuong/Config/Jellyfin:/config
      - /mnt/media_pool/media:/data/media
    ports:
      - 8096:8096
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=8080
    volumes:
      - /home/cuong/Config/qbittorrent:/config
      - /mnt/media_pool:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Radarr:/config
      - /mnt/media_pool:/data
    ports:
      - 7878:7878
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Sonarr:/config
      - /mnt/media_pool:/data
    ports:
      - 8989:8989
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Bazarr:/config
      - /mnt/media_pool/media:/data/media
    ports:
      - 6767:6767
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/prowlarr:/config
    ports:
      - 9696:9696
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8191:8191"
    restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=987
      - TZ=Asia/Ho_Chi_Minh
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/cuong/Config/Homarr:/appdata
    ports:
      - 7575:7575
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: ubuntu-mediaserver
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /home/cuong/Config/Syncthing:/config
      - /mnt/media_pool:/data
    ports:
      - 8384:8384   # Web UI
      - 22000:22000/tcp # Sync protocol
      - 22000:22000/udp # Sync protocol
      - 21027:21027/udp # Local discovery
    restart: unless-stopped